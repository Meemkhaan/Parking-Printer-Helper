<!DOCTYPE html>
<html>
<body>

<h2>Parking Printer Test</h2>

<button onclick="printReceipt()">PRINT TEST RECEIPT</button>

<script>
async function printReceipt() {
    try {
        const response = await fetch("http://127.0.0.1:8765/print", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                ticket: "BROWSER-001",
                vehicle: "Car",
                number: "ABC-123",
                amount: 200
            })
        });

        const result = await response.json();

        alert(JSON.stringify(result));

    } catch (error) {
        alert("PRINT ERROR: " + error);
    }
}
</script>

</body>
</html>
