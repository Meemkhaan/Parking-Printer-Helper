name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: apk
        env:
          PRINT_HELPER_SECRET: ${{ secrets.PRINT_HELPER_SECRET }}
          PRINTER_IP: ${{ secrets.PRINTER_IP }}
          PRINTER_PORT: ${{ secrets.PRINTER_PORT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: parking-printer-helper-debug-apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: apk/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}